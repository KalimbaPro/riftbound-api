# Riftbound x T1 2025 Worlds Champion Collection — two products, the same five cards,
# each chosen by a T1 player. Printed "T1S • 00N/005 • EN" / "T1A • 00N/005 • EN"
# (T1A line visually confirmed on the Ambessa image). Images: riftbound.org.
#
#  * T1S — Signature Edition (shipped 2026-09-02, 10,125 sets per language, EN/ZH/KO):
#    five gold-foil cards, new art by Pandart Studio. Each set contains exactly ONE card,
#    at random, serial-numbered 1–2025 with the player's signature gold-stamped on it.
#    Both the plain and the serialized printing are listed below as separate cards.
#    TODO: the serialized printing's collector line is unverified (riftbound.org slug
#    "t1s-00N-005-p-serial" suggests the same code); its riftbound_id uses "*" like other
#    signed printings, and its image is the plain one (no scan of a serial copy found).
#  * T1A — Player Bundle "Together As One" (drawing 2026-11-13..16, ships mid-December
#    2026): same five cards with T1 Worlds 2025 skin splash art; no serialized cards.
#
# Sources:
#   https://playriftbound.com/en-us/news/announcements/the-riftbound-x-t1-2025-worlds-champion-collection
#   https://playriftbound.com/en-us/news/announcements/product-drawing-faq/
#   https://riftbound.org/news/riftbounds-t1-player-bundle-worlds-2026-drawings
