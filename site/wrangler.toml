# The ScanRift website: a static-assets-only Worker, deployed next to the API with the
# same Cloudflare credentials. Build it first: `node site/build.mjs`.
# It is served at the root of its host so Riot's verification file resolves at /riot.txt.
name = "scanrift"
compatibility_date = "2026-11-01"
# Keep the workers.dev address alive alongside the custom domains (old links, previews).
workers_dev = true

# scanrift.lol is a Cloudflare zone (nameservers moved from Porkbun). www is a custom
# domain (Cloudflare manages its DNS record). The apex is a route instead: it keeps
# working whatever proxied record sits on scanrift.lol, which a custom domain refuses.
routes = [
  { pattern = "scanrift.lol/*", zone_name = "scanrift.lol" },
  { pattern = "www.scanrift.lol", custom_domain = true },
]

[assets]
directory = "./public"
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"

